name: ypay_inventory
description: YPay inventory Flutter Plugin для библиотеки YPay Flutter позволяет интегрировать встроенные бейджи и виджеты YandexPaySDK в ваши проекты. Инвентарь — это набор визуальных элементов с брендированными продуктами Яндекса.
version: 1.0.3+1
repository: https://github.com/headless-devs/ypay-inventory-flutter
issue_tracker: https://github.com/headless-devs/ypay-inventory-flutter/issues
homepage: https://thehead.ru/

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=2.0.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: ypay_inventory_android
      ios:
        default_package: ypay_inventory_ios

dependencies:
  flutter:
    sdk: flutter
  ypay_inventory_platform_interface: ^1.0.3
  ypay_inventory_android: ^1.0.3
  ypay_inventory_ios: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

analyzer:
  exclude: ["**_test.dart"]
